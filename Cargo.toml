[package]
name = "ramble-markdown"
version = "0.5.0"
edition = "2024"

[dependencies]
# 默认的 wgpu 后端在 Windows/DX12 下会常驻数百 MB 驱动内存；
# 改用更轻量的 OpenGL(glow) 后端，并关闭对本应用无用的 wayland/web_screen_reader
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
] }
# better_syntax_highlighting: 代码块语法高亮（syntect，纯 Rust 正则后端）
# embedded_image: 支持 data:image/...;base64 内嵌图片
# fetch: 支持 http(s):// 网络图片（egui_extras HttpLoader，后台线程异步加载）
# 默认特性 load-images 提供 file:// 本地图片加载（相对路径由 assets::image_base 解析）
egui_commonmark = { version = "0.24.0", features = [
    "better_syntax_highlighting",
    "embedded_image",
    "fetch",
] }
# 图片解码：png / jpeg / gif / webp（egui 的 ImageCrateLoader 复用这些解码器）
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# svg: 注册 SvgLoader（resvg 栅格化），支持 .svg 后缀的图片
# svg_text: 加载系统字体，否则 SVG 里的文字（如 shields.io 徽章）渲染为空白色块
egui_extras = { version = "0.35.0", features = ["svg", "svg_text"] }
# 与 egui_extras 同款 resvg（0.45.1，树里另有 mermaid 的 0.47 勿混）；
# memmap-fonts 让系统字体走 mmap，避免字体库整份读进内存
resvg = { version = "0.45.1", default-features = false, features = ["memmap-fonts"] }
# 纯 Rust mermaid 渲染（关闭默认的 cli 特性，只保留 png 栅格化）
mermaid-rs-renderer = { version = "0.3.1", default-features = false, features = ["png"] }
rfd = "0.17.2"
